name: Update Catalog
on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: catalog-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: python update_catalog.py
      - run: python -m apple_stock_radar --validate-catalog
      - run: python -m unittest discover -s tests
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/apple-catalog
          add-paths: products.json
          commit-message: 'catalog: add newly discovered Apple variants'
          title: 'catalog: review newly discovered Apple Store variants'
          body: |
            New official Apple Store product metadata was discovered by the weekly crawler.
            All additions are disabled by default. Existing selections are preserved.
            Review model names, regional part numbers and storage/color metadata before merging.
            Catalog validation and offline tests ran in the updater workflow.
